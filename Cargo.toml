# Octoscript-Makepad — themed component kits on the Octoscript DSL + makepad renderer.
[workspace]
resolver = "2"
members = [
    "crates/octoscript-node",
    "crates/octoscript-render",
    "crates/octoscript-makepad",
    "crates/octoscript-widgets",
    # The chart libraries, grafted in with their history (git subtree, 2026-08-09):
    # d3's grammar under `mod.d3.*`, matplotlib's charts under `mod.plot.*`.
    # Distinct namespaces, so a card may use either or both.
    "crates/makepad-d3",
    "crates/makepad-plot",
    "apps/kit-host",
    "apps/flutter-samples",
]

# runtime.json is the source contract shared by every OctoSense application.
[workspace.dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }
makepad-script = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }
# The VM-independent Octoscript node model, from the Octoscript repo itself.
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "5430518683462eebb65b56b9b5d0e620006f04f4" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../makepad/widgets" }
makepad-script = { path = "../makepad/platform/script" }

[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../octoscript/crates/octoscript-ui-l0" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-node = { path = "crates/octoscript-node" }
