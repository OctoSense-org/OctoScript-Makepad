# Octoscript-Makepad — themed component kits on the Octoscript DSL + makepad renderer.
[workspace]
resolver = "2"
members = [
    "crates/octoscript-node",
    "crates/octoscript-render",
    "crates/octoscript-makepad",
    "crates/octoscript-widgets",
    # The chart libraries, grafted in with their history (git subtree, 2026-08-09):
    # d3's grammar under `mod.d3.*`, matplotlib's charts under `mod.plot.*`.
    # Distinct namespaces, so a card may use either or both.
    "crates/makepad-d3",
    "crates/makepad-plot",
    "apps/kit-host",
    "apps/flutter-samples",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
