# Octoscript-Makepad — themed component kits on the Octoscript DSL + makepad renderer.
[workspace]
resolver = "2"
members = [
    "crates/octoscript-node",
    "crates/octoscript-render",
    "crates/octoscript-makepad",
    "crates/octoscript-widgets",
    # The chart libraries, grafted in with their history (git subtree, 2026-08-09):
    # d3's grammar under `mod.d3.*`, matplotlib's charts under `mod.plot.*`.
    # Distinct namespaces, so a card may use either or both.
    "crates/makepad-d3",
    "crates/makepad-plot",
    "apps/kit-host",
    "apps/flutter-samples",
]

# One makepad lineage for every crate here: the same guofoo/makepad revision OctoSense-org/octosense
# pins, so octosense and the kits never carry two copies of makepad-widgets / makepad-script.
[workspace.dependencies]
makepad-widgets = { git = "https://github.com/guofoo/makepad.git", rev = "beb3857aea22a6a99fb4a7b6a3b60f92359f6a4d" }
makepad-script = { git = "https://github.com/guofoo/makepad.git", rev = "beb3857aea22a6a99fb4a7b6a3b60f92359f6a4d" }
# The VM-independent Octoscript node model, from the Octoscript repo itself.
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", branch = "main" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
