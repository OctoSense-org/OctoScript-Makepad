# Octoscript-Makepad — themed component kits on the Octoscript DSL + makepad renderer.
[workspace]
resolver = "2"
members = [
    "crates/octoscript-node",
    "crates/octoscript-render",
    "crates/octoscript-makepad",
    "crates/octoscript-widgets",
    # The chart libraries, grafted in with their history (git subtree, 2026-08-09):
    # d3's grammar under `mod.d3.*`, matplotlib's charts under `mod.plot.*`.
    # Distinct namespaces, so a card may use either or both.
    "crates/makepad-d3",
    "crates/makepad-plot",
    "apps/kit-host",
    "apps/flutter-samples",
]

# One makepad lineage for every crate here: the OctoSense-org/makepad fork, so octosense
# and the kits never carry two copies of makepad-widgets / makepad-script. This rev is the
# former guofoo/makepad pin, unchanged, hosted at main.
[workspace.dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "c7346fefa467986a5afd8f077d6c75101feda04b" }
makepad-script = { git = "https://github.com/OctoSense-org/makepad.git", rev = "c7346fefa467986a5afd8f077d6c75101feda04b" }
# The VM-independent Octoscript node model, from the Octoscript repo itself.
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", branch = "main" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
