[package]
name = "kit-host"
version = "0.1.0"
edition = "2021"
description = "Generic app shell rendering a Octoscript component kit as native makepad widgets (fork-free, upstream makepad)"

[dependencies]
# The L0 profile, so this host can realize and lower a card at runtime. Depends
# on serde_json alone — it carries no makepad lineage, which is what makes it
# safe here and is why it was extracted from octoscript-core.
octoscript-ui-l0 = { path = "../../../octoscript/crates/octoscript-ui-l0" }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
makepad-plot = { path = "../../crates/makepad-plot" }

makepad-widgets = { path = "../../../makepad/widgets" }
octoscript-widgets = { path = "../../crates/octoscript-widgets" }
octoscript-render = { path = "../../crates/octoscript-render" }
octoscript-makepad = { path = "../../crates/octoscript-makepad" }

[[bin]]
name = "kit-host"
path = "src/main.rs"

[[bin]]
name = "beauty-host"
path = "src/beauty.rs"
