[package]
name = "flutter-samples"
version = "0.1.0"
edition = "2021"
description = "The flutter/samples catalog rendered as native makepad widgets from the Octoscript DSL"

[dependencies]
makepad-widgets = { path = "../../../makepad-splash/widgets" }
octoscript-widgets = { path = "../../crates/octoscript-widgets" }
octoscript-render = { path = "../../crates/octoscript-render" }
octoscript-makepad = { path = "../../crates/octoscript-makepad" }

# A cdylib for the OpenHarmony and Android builds, an rlib so the desktop binary
# below can link it, and the binary itself for `cargo run`.
[lib]
name = "flutter_samples"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flutter-samples"
path = "src/main.rs"
