[package]
name = "makepad-plot"
version = "0.2.0"
edition = "2021"
description = "Matplotlib-style plotting library for Makepad 2.0 (Octoscript)"
license = "MIT"
autoexamples = false

[dependencies]
# The workspace's single makepad checkout (see makepad-d3's note).
makepad-widgets = { workspace = true }
# The Splash kernel JIT behind `plot.series` (see src/series.rs; kept in
# sync with makepad-d3's copy).
makepad-script-compute = { workspace = true, features = ["vm"] }
makepad-script = { workspace = true }

[[bin]]
name = "plot_demo"
path = "examples/plot_demo.rs"
